[package]
name = "secd-ui"
version = "0.1.2"
edition = "2021"
publish = false
description = "LAN secrets store web console"

[lib]
name = "secd_ui"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["ssr"]
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]
csr = ["leptos/csr"]

[dependencies]
argon2 = "=0.5.3"
chacha20poly1305 = "=0.10.1"
leptos = { version = "=0.8.20", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
time = { version = "=0.3.41", default-features = false, features = ["formatting", "parsing", "std"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = "=1.9.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"] }
js-sys = "=0.3.104"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = [
  "Clipboard",
  "CredentialsContainer",
  "Document",
  "Element",
  "Headers",
  "HtmlElement",
  "HtmlInputElement",
  "Location",
  "Navigator",
  "Request",
  "RequestCredentials",
  "RequestInit",
  "RequestMode",
  "Response",
  "Storage",
  "Window",
  "console",
] }
