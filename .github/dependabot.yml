version: 2
updates:
  # github-actions: full commit-sha pins are where drift is invisible and
  # hand-tracking genuinely fails, and dependabot rewrites the pin and its
  # version comment together.
  #
  # Deliberately not cargo: with every dependency pinned to an exact version
  # and a hand-curated Cargo.lock, it would open a pull request per crate per
  # week until nobody reads them, which is worse than not having it. Advisories
  # are covered by the `advisories` job in ci.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A release that is compromised at publication is usually yanked within
    # days. Waiting a week costs nothing here and skips that window; security
    # updates ignore the cooldown.
    cooldown:
      default-days: 7
    # One pull request for the minor and patch bumps, which ci.yml re-pins and
    # arms for auto-merge. A major stays on its own, for a human.
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # bun.lock in ui/. Bun has no Dependabot security updates, so grouped
  # minor/patch version PRs are the idle-time opener; bun-audit is the PR gate.
  - package-ecosystem: bun
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bun-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
