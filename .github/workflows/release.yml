name: release
on:
  push:
    branches: [main]

# PR ci is the test gate. linux + darwin build in parallel; publish merges latest.json once.
permissions:
  contents: write
  packages: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          cache-bin: true
      - name: musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build, sign, push image
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          scripts/release.sh
          scripts/publish-release.sh --no-latest
      - name: make secd-web GHCR public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          pkg="secd-web"
          # First 2xx wins. Package starts private; k3s needs anonymous pull.
          for spec in \
            "PATCH /orgs/${owner}/packages/container/${pkg}" \
            "PUT /orgs/${owner}/packages/container/${pkg}" \
            "PATCH /user/packages/container/${pkg}"
          do
            method="${spec%% *}"
            path="${spec#* }"
            if gh api --method "$method" "$path" -f visibility=public; then
              echo "visibility public via ${method} ${path}"
              exit 0
            fi
          done
          echo "k3s cannot pull until the package is public: https://github.com/orgs/${owner}/packages/container/package/${pkg}"
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latest-linux
          path: target/release-dist/latest.json
          if-no-files-found: error

  darwin:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          cache-bin: true
      - name: build and sign darwin aarch64
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          scripts/release.sh --target aarch64-apple-darwin
          scripts/publish-release.sh --no-latest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latest-darwin
          path: target/release-dist/latest.json
          if-no-files-found: error

  publish:
    needs: [linux, darwin]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: latest-linux
          path: target/release-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: latest-darwin
          path: target/release-dist-darwin
      - name: merge and publish latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/publish-release.sh --latest-only --merge-published \
            target/release-dist-darwin/latest.json
