name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: an existing tag to publish
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  # Never cancel mid-publish: that is how a half-uploaded release happens.
  cancel-in-progress: false

# Least privilege by default. Every job that needs more says so, and no job
# that compiles third-party code is one of them.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  # Cheap refusals before any runner time is spent.
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Version agreement across all seven files that restate it, plus the
      # pipeline pin. A release built from a half-bumped tree would name an
      # image tag that does not exist.
      - run: scripts/check.sh contract
      - name: tag matches the version and descends from main
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ver="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{if (match($0,/"[^"]+"/)) {print substr($0,RSTART+1,RLENGTH-2); exit}}' Cargo.toml)"
          [ "$TAG" = "v${ver}" ] || { echo "tag ${TAG} is not v${ver}" >&2; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "${SHA} is not an ancestor of main" >&2; exit 1; }
      # The gate is what makes "PR ci is the test gate" true for this commit.
      - name: ci was green for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/commits/${SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "gate") | .conclusion] | index("success")' \
            | grep -q . || { echo "no successful ci gate for ${SHA}" >&2; exit 1; }

  # Compilation. No secrets, no write permission: build.rs from every
  # transitive dependency runs here, so this job must be powerless.
  build:
    needs: [preflight]
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            image: "yes"
          - os: macos-14
            target: aarch64-apple-darwin
            image: "no"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: target
        env:
          TRIPLE: ${{ matrix.target }}
        run: rustup target add "$TRIPLE"
      - if: matrix.image == 'yes'
        run: |
          command -v musl-gcc >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y musl-tools
          }
      - if: matrix.image == 'yes'
        run: scripts/check.sh ui
      - name: build
        env:
          TRIPLE: ${{ matrix.target }}
          WANT_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          args=(--target "$TRIPLE" --build-only)
          [ "$WANT_IMAGE" = "yes" ] || args+=(--no-image)
          scripts/release.sh "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.target }}
          path: target/release-dist/
          if-no-files-found: error

  # Signing. Holds the cosign key and compiles nothing.
  sign:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
          merge-multiple: true
          path: target/release-dist
      - name: sign
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          for triple in x86_64-unknown-linux-musl aarch64-apple-darwin; do
            scripts/release.sh --target "$triple" --sign-only --no-image
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed
          path: target/release-dist/
          if-no-files-found: error

  # GHCR. Holds packages: write and compiles nothing. The image is signed
  # here, because it is what actually runs and what the deploy pins.
  image:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
      # Provenance only. Contract rule 10 keeps these off anything that compiles.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-x86_64-unknown-linux-musl
          path: target/release-dist
      - name: push and sign the image
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          digest="$(scripts/push-image.sh \
            --binary target/release-dist/secd-web \
            --image "ghcr.io/appsynergy-io/secd-web:${ver}" \
            --extra-tag "sha-${GITHUB_SHA}")"
          scripts/ensure-cosign.sh
          cosign sign --key env://COSIGN_KEY --yes --tlog-upload=false \
            "ghcr.io/appsynergy-io/secd-web@${digest}"
          printf '%s\n' "$digest" > image-digest.txt
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/appsynergy-io/secd-web
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest
          path: image-digest.txt
          if-no-files-found: error

  # The only job with contents: write. Draft, upload, verify, then publish.
  publish:
    needs: [preflight, sign, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed
          path: target/release-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-digest
          path: target/release-dist
      - name: sbom
        run: scripts/sbom.sh target/release-dist/secd-sbom.cyclonedx.json
      # Explicit paths rather than a glob: the two released binaries, and not
      # their .sig files.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release-dist/secd-x86_64-unknown-linux-musl
            target/release-dist/secd-aarch64-apple-darwin
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ github.sha }}
        run: scripts/publish-release.sh --tag "$TAG" --target "$SHA"
