name: audit
on:
  schedule:
    # Advisories land between commits, so pull-request time alone would miss
    # them. Weekly, and it opens an issue rather than turning an unrelated
    # pull request red at 3am for a dependency nobody touched.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # scripts/audit.sh installs a pinned, checksummed cargo-audit binary.
      # This job holds issues: write, so it must not compile anything. It used
      # to build cargo-audit from source here, which runs build.rs from that
      # crate's whole dependency tree beside a token that can write to this
      # repository -- and at whatever version crates.io served that morning.
      - name: cargo-audit
        id: audit
        run: |
          set -uo pipefail
          scripts/audit.sh --json audit.json
          echo "status=$?" >>"$GITHUB_OUTPUT"
      - name: open an issue for anything found
        if: steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          summary="$(python3 - <<'PY'
          import json

          with open("audit.json", encoding="utf-8") as f:
              report = json.load(f)
          rows = []
          for entry in report.get("vulnerabilities", {}).get("list", []):
              advisory = entry.get("advisory", {})
              package = entry.get("package", {})
              rows.append(
                  f"- `{package.get('name')} {package.get('version')}` — "
                  f"{advisory.get('id')}: {advisory.get('title')}"
              )
          print("\n".join(rows) or "cargo-audit reported a problem with no advisory list.")
          PY
          )"
          # One open issue at a time; a second week of the same advisories
          # should update the conversation, not start a new one.
          existing="$(gh -R "$REPO" issue list --state open --label advisory --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh -R "$REPO" issue comment "$existing" --body "$(printf 'Still open as of %s\n\n%s' "$RUN_URL" "$summary")"
          else
            gh -R "$REPO" issue create --label advisory \
              --title "cargo-audit advisories" \
              --body "$(printf '%s\n\n%s' "$summary" "$RUN_URL")"
          fi
