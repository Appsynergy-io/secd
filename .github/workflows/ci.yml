name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Per pull request, so a force-push cancels its own predecessor and nothing
  # else. Never cancel on main: `warm` is the only job that writes the cache.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # A guard that can skip itself is not a guard.
  SECD_REQUIRE_BROWSER: "1"
  SECD_REQUIRE_LINTERS: "1"

jobs:
  # No cargo build at all: contract, shellcheck, actionlint, rustfmt. Reports
  # in about a minute, so the cheap mistakes never cost a test run.
  fast:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y shellcheck
          }
      - run: scripts/check.sh fast

  # crates/secd-web/build.rs refuses to build without a fresh
  # crates/secd-ui/dist, so this is a prerequisite of every cargo job rather
  # than a peer lane.
  ui:
    if: github.event_name != 'push'
    needs: [fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/check.sh ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-dist
          path: crates/secd-ui/dist
          if-no-files-found: error
          retention-days: 1

  clippy:
    if: github.event_name != 'push'
    needs: [ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-dist
          path: crates/secd-ui/dist
      # Built from this same commit in this same run, but the checkout is
      # newer than it, so build.rs would otherwise call it stale.
      - run: touch crates/secd-ui/dist/*
      - run: scripts/check.sh clippy

  test:
    if: github.event_name != 'push'
    needs: [ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-dist
          path: crates/secd-ui/dist
      - run: touch crates/secd-ui/dist/*
      - uses: ./.github/actions/testdeps
      - name: test
        run: |
          # new_session installs a session keyring on THIS shell, so the check
          # must run in the same run: block to inherit it.
          keyctl new_session
          scripts/check.sh test

  test-release:
    if: github.event_name != 'push'
    needs: [ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-dist
          path: crates/secd-ui/dist
      - run: touch crates/secd-ui/dist/*
      - uses: ./.github/actions/testdeps
      - name: test-release
        run: |
          keyctl new_session
          scripts/check.sh test-release

  # Only needs secd-core, so no ui dependency.
  compile-fail:
    if: github.event_name != 'push'
    needs: [fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/check.sh compile-fail

  # The release path, end to end, against a local registry and a stand-in gh.
  # It publishes nothing and needs no secret.
  release-dry:
    if: github.event_name != 'push'
    needs: [fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/check.sh release-dry

  # Flags advisories introduced by a pull request, at pull-request time. The
  # weekly audit workflow covers advisories published after a merge.
  deps:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  # The only job named in branch protection. Every other job is a `needs` of
  # this one, which is what makes treating "skipped" as acceptable safe: a job
  # skipped because its dependency failed is always accompanied by that
  # dependency reporting "failure" here.
  gate:
    if: always() && github.event_name != 'push'
    needs: [fast, ui, clippy, test, test-release, compile-fail, release-dry, deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: evaluate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          bad = []
          for name in sorted(needs):
              result = needs[name]["result"]
              print(f"{result:>9}  {name}")
              if result not in ("success", "skipped"):
                  bad.append(name)
          if bad:
              sys.exit("gate: did not succeed -> " + ", ".join(bad))
          print("gate: ok")
          PY

  # main only, and not part of the gate. This is the sole writer of the shared
  # cache: caches are branch-scoped, so without a run on the default branch
  # every pull request starts cold. Running every lane means the saved target/
  # holds the debug, release and wasm32 artifact sets the lanes restore.
  warm:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y shellcheck
          }
      - uses: ./.github/actions/testdeps
      - name: check
        run: |
          keyctl new_session
          scripts/check.sh
