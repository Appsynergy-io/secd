name: ci
# One workflow. GitHub treats every YAML under .github/workflows/ as a named
# workflow (a notification stream, a check, a bill). Jobs skip by if:; a
# second file is a second pipeline and plan-contract.sh refuses it.
#
# pull_request / merge_group / dispatch (no tag) → validate, once per SHA.
# push to main → seed cache and tag v from Cargo.toml. Does not rerun the suite.
#   TAG_TOKEN (PAT) pushes the tag so this same file retriggers; GITHUB_TOKEN
#   never does.
# push of v*.*.* / dispatch with tag → publish. Never cancel mid-publish.
# No schedule.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to publish; empty runs the validate path
        required: false
        type: string
        default: ""

concurrency:
  # Per pull request, so a force-push cancels its own predecessor. Tag and
  # main share a group with cancel-in-progress off: never cancel a publish
  # or the only cache write.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # A guard that can skip itself is not a guard.
  SECD_REQUIRE_BROWSER: "1"
  SECD_REQUIRE_LINTERS: "1"

jobs:
  # No cargo build at all: contract, shellcheck, actionlint, zizmor, rustfmt.
  # Reports in about a minute, so the cheap mistakes never cost a test run.
  fast:
    name: fast — contract, shell, workflow, fmt
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y shellcheck
          }
      - run: scripts/check.sh fast

  # gitleaks over the working tree and over every commit that produced it.
  # This is a secrets manager: the scan that catches a committed value is the
  # one check the gate cannot be missing, so it is required, it is never
  # advisory, and it runs whatever changed -- a value can land in any file.
  #
  # fetch-depth: 0 because the history half of the lane needs the history.
  # check.sh refuses a shallow clone rather than reporting a pass over one
  # commit.
  secrets:
    name: secrets — gitleaks over the tree and the history
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check.sh secrets

  # Which lanes are worth running. The base comes from git, not the event
  # payload, so this behaves identically on pull_request, merge_group and push
  # and does not depend on the shape of any webhook. It fails open: if the base
  # cannot be resolved, everything is considered changed.
  changes:
    name: changes — what this pull request touches
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        run: |
          set -uo pipefail
          git fetch --no-tags -q origin main || true
          base="$(git merge-base HEAD origin/main 2>/dev/null)"
          if [ -z "$base" ]; then
            echo "no base to diff against; treating everything as changed" >&2
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Every job downstream of this is `if: code == true`, and the gate
          # reads a skipped job as success -- so anything missing from this
          # pattern is not "cheaper", it is unchecked. scripts/, deploy/ and
          # .github/ are here because they decide how the code is built and
          # shipped; contract.toml and every *.md are here because
          # tests/plan_contract.rs reads them at run time --
          # T_CONTRACT_AGENTS_EQ_CLAUDE compares AGENTS.md with CLAUDE.md and
          # T_CONTRACT_ONE_DOC enumerates every tracked markdown file, so a
          # documentation-only pull request that skipped `test` could merge
          # those two invariants broken. keys/ and packaging/ for the same
          # reason: keys/cosign.pub is include_str!'d into src/update.rs and
          # tests/release_scripts.rs asserts it matches the copy embedded in
          # packaging/install.sh. ui/ is the bun console.
          if git diff --name-only "$base" HEAD \
            | grep -qE '^(src/|crates/|tests/|tools/|scripts/|deploy/|packaging/|skills/|keys/|ui/|\.github/|contract\.toml$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|.*\.md$)'; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  # crates/secd-web/build.rs refuses to build without a fresh ui/dist, so this
  # is a prerequisite of every cargo job rather than a peer lane.
  ui:
    name: ui — bun console into ui/dist
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '')) && needs.changes.outputs.code == 'true'
    needs: [fast, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/check.sh ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 1

  bun-audit:
    name: bun-audit — bun audit against ui/bun.lock
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '')) && needs.changes.outputs.code == 'true'
    needs: [fast, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/check.sh bun-audit

  crypto-parity:
    name: crypto-parity — bun dist matches secd-core vectors
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '')) && needs.changes.outputs.code == 'true'
    needs: [fast, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/check.sh crypto-parity

  clippy:
    name: clippy — workspace, all targets, warnings denied
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '')) && needs.changes.outputs.code == 'true'
    needs: [ui, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-dist
          path: ui/dist
      # Built from this same commit in this same run, but the checkout is
      # newer than it, so build.rs would otherwise call it stale.
      - run: find ui/dist -type f -exec touch {} +
      - run: scripts/check.sh clippy

  test:
    name: test — workspace, debug
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '')) && needs.changes.outputs.code == 'true'
    needs: [ui, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-dist
          path: ui/dist
      - run: find ui/dist -type f -exec touch {} +
      - uses: ./.github/actions/testdeps
        id: testdeps
      - name: test
        env:
          SECD_BROWSER: ${{ steps.testdeps.outputs.browser }}
        run: |
          # new_session installs a session keyring on THIS shell, so the check
          # must run in the same run: block to inherit it.
          keyctl new_session
          scripts/check.sh test

  test-release:
    name: test-release — workspace, release profile
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '')) && needs.changes.outputs.code == 'true'
    needs: [ui, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-dist
          path: ui/dist
      - run: find ui/dist -type f -exec touch {} +
      - uses: ./.github/actions/testdeps
        id: testdeps
      - name: test-release
        env:
          SECD_BROWSER: ${{ steps.testdeps.outputs.browser }}
        run: |
          keyctl new_session
          scripts/check.sh test-release

  # Only needs secd-core, so no ui dependency.
  compile-fail:
    name: compile-fail — Secret stays unprintable
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '')) && needs.changes.outputs.code == 'true'
    needs: [fast, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/check.sh compile-fail

  # The release path, end to end, against a local registry and a stand-in gh.
  # It publishes nothing and needs no secret.
  # Not gated on the code filter: this lane is a minute, and the release path
  # is worth running even for a change the filter calls documentation.
  release-dry:
    name: release-dry — the release path against a local registry
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '')
    needs: [fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/check.sh release-dry

  # There is deliberately no dependency-review job here. scripts/audit.sh
  # reports a strict superset of what dependency review would flag, from the
  # same advisory database, and the `advisories` job in this file files what
  # it finds as an issue rather than turning a pull request red for a
  # dependency nobody in it touched.
  #
  # `gate` is the only job named in branch protection, so its name is that
  # check's context and cannot change. Every job that reports on a pull
  # request is a `needs` of this one -- plan-contract.sh proves it, because a
  # job outside this list can fail while the gate reports success -- and that
  # is what makes treating "skipped" as acceptable safe: a job skipped
  # because its dependency failed is always accompanied by that dependency
  # reporting "failure" here. `warm` and `tag` (push to main) and the publish
  # chain (tag v*) are exempt: they never report on a pull request.
  gate:
    name: gate
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == ''))
    needs:
      - changes
      - fast
      - secrets
      - ui
      - bun-audit
      - crypto-parity
      - clippy
      - test
      - test-release
      - compile-fail
      - release-dry
      - advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: evaluate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          bad = []
          rows = []
          for name in sorted(needs):
              result = needs[name]["result"]
              print(f"{result:>9}  {name}")
              mark = {"success": "✅", "skipped": "⏭️"}.get(result, "❌")
              rows.append(f"| `{name}` | {mark} {result} |")
              if result not in ("success", "skipped"):
                  bad.append(name)

          # The same table the log holds, one click deep instead of three.
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              verdict = ("**gate: " + ", ".join(bad) + " did not succeed**") if bad else "**gate: ok**"
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## gate\n\n| job | result |\n| --- | --- |\n")
                  fh.write("\n".join(rows) + "\n\n" + verdict + "\n")

          if bad:
              sys.exit("gate: did not succeed -> " + ", ".join(bad))
          print("gate: ok")
          PY

  # main only, and not part of the gate. Seeds the shared cache: caches are
  # branch-scoped, so without a run on the default branch every pull request
  # starts cold. Does not rerun the suite; the merge queue already did.
  warm:
    name: warm — seed the shared cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo fetch --locked

  # main only. Tags v from Cargo.toml if that tag does not exist. TAG_TOKEN
  # is a PAT so the tag push retriggers this file (publish jobs). The default
  # GITHUB_TOKEN never does. Never clobber an existing tag.
  tag:
    name: tag — v from Cargo.toml
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: tag if missing
        env:
          GH_TOKEN: ${{ secrets.TAG_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || {
            echo "tag: secrets.TAG_TOKEN is empty; GITHUB_TOKEN cannot retrigger this workflow" >&2
            exit 1
          }
          ver="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{if (match($0,/"[^"]+"/)) {print substr($0,RSTART+1,RLENGTH-2); exit}}' Cargo.toml)"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]] \
            || { echo "tag: bad version ${ver}" >&2; exit 1; }
          tag="v${ver}"
          if git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null; then
            echo "tag: ${tag} exists"
            exit 0
          fi
          # git push, not the refs API: creating a ref via API is a `create`
          # event and does not retrigger `on.push.tags`.
          git config user.name secd-ci
          git config user.email secd@users.noreply.github.com
          git tag -a "$tag" "$SHA" -m "$tag"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
            push origin "refs/tags/${tag}"
          echo "tag: pushed ${tag} at ${SHA}"

  # Tag (or a dispatch that names one). Cheap refusals, then the matrix,
  # then sign / image / publish. Compile jobs hold no secret and no write.
  # Fail-fast on the billed matrix: one bad OS kills the rest.
  #
  # The PR already validated this SHA. preflight proves that, and that the
  # tag matches Cargo.toml, rather than running the suite again.
  preflight:
    name: preflight — tag matches version and is on main
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # Version agreement across all seven files that restate it, plus the
      # pipeline pin. A release built from a half-bumped tree would name an
      # image tag that does not exist.
      - run: scripts/check.sh contract
      - name: tag matches the version and descends from main
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ver="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{if (match($0,/"[^"]+"/)) {print substr($0,RSTART+1,RLENGTH-2); exit}}' Cargo.toml)"
          [ "$TAG" = "v${ver}" ] || { echo "tag ${TAG} is not v${ver}" >&2; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "${SHA} is not an ancestor of main" >&2; exit 1; }

  # Compilation. No secrets, no write permission: build.rs from every
  # transitive dependency runs here, so this job must be powerless.
  build:
    name: build — ${{ matrix.target }}
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    needs: [preflight]
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            image: "yes"
          - os: macos-14
            target: aarch64-apple-darwin
            image: "no"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: target
        env:
          TRIPLE: ${{ matrix.target }}
        run: rustup target add "$TRIPLE"
      - if: matrix.image == 'yes'
        run: |
          command -v musl-gcc >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y musl-tools
          }
      - if: matrix.image == 'yes'
        run: scripts/check.sh ui
      - name: build
        env:
          TRIPLE: ${{ matrix.target }}
          WANT_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          args=(--target "$TRIPLE" --build-only)
          [ "$WANT_IMAGE" = "yes" ] || args+=(--no-image)
          scripts/release.sh "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.target }}
          path: target/release-dist/
          if-no-files-found: error
          # These hand one job's output to the next; the release itself is
          # where the bytes live afterwards. The default of 90 days keeps
          # signed binaries and the digest sitting in Actions storage for a
          # quarter for no reason.
          retention-days: 7

  # Signing. Holds the cosign key and compiles nothing.
  sign:
    name: sign — cosign over both binaries
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
          merge-multiple: true
          path: target/release-dist
      - name: sign
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          for triple in x86_64-unknown-linux-musl aarch64-apple-darwin; do
            scripts/release.sh --target "$triple" --sign-only --no-image
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed
          path: target/release-dist/
          if-no-files-found: error
          retention-days: 7

  # GHCR. Holds packages: write and compiles nothing. The image is signed
  # here, because it is what actually runs and what the deploy pins.
  image:
    name: image — push and sign the GHCR manifest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
      # Provenance only. Contract rule 10 keeps these off anything that compiles.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-x86_64-unknown-linux-musl
          path: target/release-dist
      # GHCR 403/404/405s the hand-rolled OCI PUT/PATCH. docker login +
      # docker push is the path that published v0.1.10. Dry-run still uses
      # the python pusher against fake-registry. No docker/login-action:
      # Actions policy is selected (GitHub-owned + Swatinem/rust-cache),
      # and GitHub validates every uses: in this file at parse time, even
      # on a pull request that will skip this job.
      - name: docker login
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: push and sign the image
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SECD_PUSH_WITH_DOCKER: "1"
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          digest="$(scripts/push-image.sh \
            --binary target/release-dist/secd-web \
            --image "ghcr.io/appsynergy-io/secd-web:${ver}" \
            --extra-tag "sha-${GITHUB_SHA}")"
          scripts/ensure-cosign.sh
          cosign sign --key env://COSIGN_KEY --yes --tlog-upload=false \
            "ghcr.io/appsynergy-io/secd-web@${digest}"
          printf '%s\n' "$digest" > image-digest.txt
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/appsynergy-io/secd-web
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest
          path: image-digest.txt
          if-no-files-found: error
          retention-days: 7

  # The only job with contents: write. Draft, upload, verify, then publish.
  publish:
    name: publish — draft, verify, then release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    needs: [preflight, sign, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed
          path: target/release-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-digest
          path: target/release-dist
      - name: sbom
        run: scripts/sbom.sh target/release-dist/secd-sbom.cyclonedx.json
      # Explicit paths rather than a glob: the two released binaries, and not
      # their .sig files.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release-dist/secd-x86_64-unknown-linux-musl
            target/release-dist/secd-aarch64-apple-darwin
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ github.sha }}
        run: scripts/publish-release.sh --tag "$TAG" --target "$SHA"

  # Cheap. rustsec can change with no commit; this still runs on the PR so
  # there is no clock. Files an issue; does not compile (the binary is pinned)
  # and does not fail the job, so a dependency nobody touched does not redden
  # the gate. It is still a needs of gate so a crash here cannot hide.
  advisories:
    name: advisories — cargo-audit
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # No setup action: this job compiles nothing and must not write the
      # shared cache. scripts/audit.sh installs a pinned cargo-audit binary.
      # This job holds issues: write, so it must not compile anything. It used
      # to build cargo-audit from source here, which runs build.rs from that
      # crate's whole dependency tree beside a token that can write to this
      # repository -- and at whatever version crates.io served that morning.
      - name: cargo-audit
        id: audit
        run: |
          set -uo pipefail
          scripts/audit.sh --json audit.json
          echo "status=$?" >>"$GITHUB_OUTPUT"
      - name: open an issue for anything found
        if: steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          summary="$(python3 - <<'PY'
          import json

          with open("audit.json", encoding="utf-8") as f:
              report = json.load(f)
          rows = []
          for entry in report.get("vulnerabilities", {}).get("list", []):
              advisory = entry.get("advisory", {})
              package = entry.get("package", {})
              rows.append(
                  f"- `{package.get('name')} {package.get('version')}` — "
                  f"{advisory.get('id')}: {advisory.get('title')}"
              )
          print("\n".join(rows) or "cargo-audit reported a problem with no advisory list.")
          PY
          )"
          # One open issue at a time; a second week of the same advisories
          # should update the conversation, not start a new one.
          existing="$(gh -R "$REPO" issue list --state open --label advisory --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh -R "$REPO" issue comment "$existing" --body "$(printf 'Still open as of %s\n\n%s' "$RUN_URL" "$summary")"
          else
            gh -R "$REPO" issue create --label advisory \
              --title "cargo-audit advisories" \
              --body "$(printf '%s\n\n%s' "$summary" "$RUN_URL")"
          fi
