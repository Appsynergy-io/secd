name: ci
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # A missing browser used to make the headless DOM assertions vanish while
      # the run still reported ok. Require them.
      SECD_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # rust-toolchain.toml is the single source of truth for channel,
      # components and targets. `rustup show active-toolchain` materialises it.
      - name: toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-all-crates: true
          cache-bin: true
      - name: browser
        run: |
          set -euo pipefail
          for b in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$b" >/dev/null 2>&1; then
              echo "SECD_BROWSER=$(command -v "$b")" >>"$GITHUB_ENV"
              exit 0
            fi
          done
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          command -v chromium-browser
      - name: check
        run: |
          if ! command -v keyctl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y keyutils
          fi
          # new_session installs a session keyring on THIS shell; the
          # check must run in the same run: block to inherit it.
          keyctl new_session
          scripts/check.sh
