name: setup
description: Toolchain and shared build cache, identical in every job.
runs:
  using: composite
  steps:
    # rust-toolchain.toml is the single source of truth for channel,
    # components and targets; this materialises it.
    - shell: bash
      run: rustup show active-toolchain
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # shared-key replaces the per-job key component, so every job in every
        # workflow reads the same entry. Only main writes it: caches are
        # branch-scoped, so an entry written on a PR branch is readable by
        # nothing else and would just evict the one that is.
        shared-key: secd-v1
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
        cache-all-crates: true
        cache-bin: true
