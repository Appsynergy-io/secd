name: testdeps
description: System dependencies the test lanes need — kernel keyring and a browser.
outputs:
  browser:
    description: Absolute path to the browser the headless DOM assertions drive.
    value: ${{ steps.browser.outputs.path }}
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        command -v keyctl >/dev/null 2>&1 || {
          sudo apt-get update
          sudo apt-get install -y keyutils
        }
        SECD_ROOT="${GITHUB_WORKSPACE}"
        SECD_TOOL_TAG="testdeps"
        CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
        export SECD_ROOT SECD_TOOL_TAG CARGO_HOME
        # shellcheck source=scripts/tools.sh
        . "$GITHUB_WORKSPACE/scripts/tools.sh"
        secd_ensure_bun
    # SECD_REQUIRE_BROWSER turns a missing browser into a test failure, so
    # resolve one here rather than discovering it in the assertion.
    #
    # A step output rather than GITHUB_ENV: the environment file is read back
    # by every later step of the job, so anything that writes it can rewrite a
    # variable a later step trusts. The one step that needs this reads it by
    # name.
    - id: browser
      shell: bash
      run: |
        set -euo pipefail
        for b in google-chrome-stable google-chrome chromium chromium-browser; do
          if command -v "$b" >/dev/null 2>&1; then
            echo "path=$(command -v "$b")" >>"$GITHUB_OUTPUT"
            exit 0
          fi
        done
        sudo apt-get update
        sudo apt-get install -y chromium-browser
        echo "path=$(command -v chromium-browser)" >>"$GITHUB_OUTPUT"
