name: release
on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: arch-host
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /data/build/target/secd
      SECD_CACHE_CAP_GB: "20"
    steps:
      - uses: actions/checkout@v4
      - name: release
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SECD_RELEASE_TOKEN: ${{ secrets.SECD_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          scripts/ci-cache.sh
          scripts/release.sh
          scripts/publish-release.sh
