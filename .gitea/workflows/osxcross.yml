name: osxcross
on:
  push:
    tags: ['v*']

jobs:
  darwin:
    runs-on: osxcross-host
    steps:
      - uses: actions/checkout@v4
      - name: release
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SECD_RELEASE_TOKEN: ${{ secrets.SECD_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          scripts/release.sh --target aarch64-apple-darwin
          scripts/publish-release.sh --no-latest
      - uses: actions/upload-artifact@v3
        with:
          name: latest-darwin
          path: target/release-dist/latest.json
          if-no-files-found: error

  merge:
    needs: [darwin]
    runs-on: arch-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v3
        with:
          name: latest-darwin
          path: target/release-dist-darwin
      - name: merge latest.json
        env:
          SECD_RELEASE_TOKEN: ${{ secrets.SECD_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p target/release-dist
          scripts/publish-release.sh --latest-only --merge-published \
            target/release-dist-darwin/latest.json
