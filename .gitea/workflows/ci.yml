name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: arch-host
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /data/build/target/secd
      SECD_CACHE_CAP_GB: "20"
    steps:
      - uses: actions/checkout@v4
      - name: check
        run: |
          scripts/ci-cache.sh
          scripts/check.sh
