[package]
name = "secd-import-legacy"
version = "0.1.3"
edition = "2021"
publish = false
description = "Throwaway sdxd → secd importer"

[[bin]]
name = "secd-import-legacy"
path = "src/main.rs"

[lib]
name = "secd_import_legacy"
path = "src/lib.rs"

[dependencies]
anyhow = "=1.0.104"
secd = { path = "../.." }
secd-core = { path = "../../crates/secd-core" }
serde_json = "=1.0.151"
zeroize = "=1.9.0"
