[workspace]
members = ["crates/secd-core", "crates/secd-web", "tools/import-legacy"]
resolver = "2"

[package]
name = "secd"
version = "0.1.17"
edition = "2021"
publish = false
description = "LAN secrets store"
license = "Apache-2.0"

[[bin]]
name = "secd"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = "=4.6.6"
crossterm = "=0.28.1"
hex = "=0.4.3"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rustls = { version = "=0.23.43", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-pemfile = "=2.2.0"
secd-core = { path = "crates/secd-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets", "getrandom"] }
zeroize = "=1.9.0"

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
axum-server = { version = "=0.7.3", default-features = false, features = ["tls-rustls"] }
hex = "=0.4.3"
openssl = "=0.10.81"
secd-web = { path = "crates/secd-web" }
serde_json = "=1.0.151"
tokio = { version = "=1.44.2", features = ["macros", "net", "rt-multi-thread", "test-util", "time"] }
tower = { version = "=0.5.3", features = ["util"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.aws-lc-sys]
opt-level = 2

[profile.dev.package.openssl-sys]
opt-level = 2

[profile.dev.package.libsqlite3-sys]
opt-level = 2

