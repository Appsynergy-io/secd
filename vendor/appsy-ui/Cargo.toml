# Its own workspace root. This crate is `exclude`d from the repo workspace, so cargo keeps
# walking upward from here looking for one -- and an agent worktree lives under
# .claude/worktrees/, inside the primary checkout, where it finds the outer Cargo.toml and
# fails. `cargo fmt --all` reaches this manifest as a path dependency of secd-ui.
[workspace]

[package]
name = "appsy-ui"
description = "AppSynergy design system: tokens, components, behavior, fonts, icons — one crate, consumed by Leptos apps."
version = "0.1.0"
edition = "2021"
publish = false
autotests = false
autobenches = false
autoexamples = false

[lib]
test = false
doctest = false

[lints.rust]
unused = "allow"

[lints.clippy]
all = "allow"

[dependencies]
# dep-add: leptos — the component framework this library targets; the crate is Leptos views.
leptos = { version = "0.8.20", default-features = false }
# dep-add: web-sys — browser API access for behavior/ primitives; the crate's chartered DOM path.
web-sys = { version = "0.3", features = ["Clipboard", "CssStyleDeclaration", "Document", "DomRect", "Element", "EventTarget", "HtmlElement", "HtmlImageElement", "KeyboardEvent", "Navigator", "Node", "NodeList", "Performance", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Window"] }
# dep-add: wasm-bindgen — DOM event closures for behavior/; companion to web-sys.
wasm-bindgen = "0.2"
# dep-add: js-sys — calls the browser's own Date.parse/toLocaleString so crypto
# quote expiry renders exactly as the reference does (locale/TZ included).
js-sys = "0.3"
# dep-add: send_wrapper — wraps !Send DOM handles for leptos's Send-bounded cleanup hooks
# (single-threaded wasm; already in the tree via leptos itself).
send_wrapper = "0.6"

[features]
# Nothing on by default. Consumers pick exactly one rendering mode;
# a library enabling one would break every other consumer via feature
# unification.
default = []
csr = ["leptos/csr"]
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr"]
# Payload gates — off by default so button-only consumers compile button-only code.
calendar = []
charts = []
command = []
overlays = []
toast = []
# Fonts as served files instead of base64 data: URIs — `@font-face` points at
# `/fonts/{name}` and `fonts::files()` exposes the woff2 for the consumer to
# serve (better LCP/caching; recommended for the marketing site).
font-files = []
